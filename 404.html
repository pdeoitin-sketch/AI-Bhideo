<!DOCTYPE html>
<html lang="en" class="scroll-smooth" style="background-color: #f7f9fc; color: #202b38; color-scheme: light;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI-Bhideo — Creative AI workspace</title>
    <meta name="description" content="Bring ideas into motion with the AI-Bhideo creative workspace. Shape video prompts, explore render profiles, and export local browser-rendered previews." />
    <meta name="theme-color" content="#f7f9fc" />
    <!-- Crimson and blue film-mark favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%23a32340'/><stop offset='100%' stop-color='%23294f72'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='%23ffffff'/><rect x='13' y='13' width='74' height='74' rx='22' fill='url(%23g)'/><polygon points='42,31 68,50 42,69' fill='%23fffefa'/></svg>" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Inline critical workspace theme so the first paint matches the app -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #f7f9fc;
        color: #202b38;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
      }
      #root {
        min-height: 100vh;
      }
    </style>
    <link rel="stylesheet" href="./bundle/app.css" data-prebuilt-css />
  </head>
  <body class="antialiased overflow-x-hidden min-h-screen">
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f7f9fc;color:#202b38;padding:24px;text-align:center;">
        <div style="width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#a32340,#294f72);padding:2px;margin-bottom:16px;box-shadow:0 8px 22px rgba(41,79,114,0.16);">
          <div style="width:100%;height:100%;background:#ffffff;border-radius:14px;display:flex;align-items:center;justify-content:center;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
              <polygon points="6 4 20 12 6 20 6 4" fill="#a32340" />
            </svg>
          </div>
        </div>
        <h1 style="font-size:22px;font-weight:800;margin:0 0 8px 0;letter-spacing:-0.02em;">AI-Bhideo</h1>
        <p style="font-size:13px;color:#526171;margin:0;">Preparing your creative workspace…</p>
      </div>
    </div>
    <noscript>
      <div style="padding:24px;text-align:center;background:#f7f9fc;color:#202b38;">
        Please enable JavaScript to run the AI-Bhideo creative workspace.
      </div>
    </noscript>
    <script data-bundle-watchdog>
      // If the prebuilt bundle cannot be fetched (a stale Pages deployment where
      // bundle/app.js does not exist yet, a bad upload, an offline CDN…) the page
      // would otherwise sit on the splash forever and look like a blank screen.
      // Registered before the tag below is parsed, in the capture phase, so the
      // resource error is caught even though the element does not exist yet.
      window.addEventListener(
        'error',
        function (event) {
          var target = event && event.target;
          if (!target || target.tagName !== 'SCRIPT') return;
          if (!/bundle\/app\.js$/.test(target.src || '')) return;
          var root = document.getElementById('root');
          if (!root) return;
          var note = document.createElement('div');
          note.setAttribute(
            'style',
            'max-width:560px;margin:28px auto 0;padding:18px 20px;border:1px solid #d9b8bf;border-radius:14px;background:#ffffff;color:#202b38;font-size:13px;line-height:1.7;text-align:left;'
          );
          note.innerHTML =
            '<strong style="color:#a32340;">Could not load bundle/app.js</strong><br />' +
            'The deployed build is missing or out of date. Run ' +
            '<code style="font-family:\'JetBrains Mono\',monospace;color:#294f72;">npm run build</code>' +
            ' and commit <code style="font-family:\'JetBrains Mono\',monospace;color:#294f72;">bundle/</code>, ' +
            'then make sure GitHub Pages rebuilt from the latest commit on ' +
            '<code style="font-family:\'JetBrains Mono\',monospace;color:#294f72;">main</code>.';
          root.appendChild(note);
        },
        true
      );
    </script>
    <script defer src="./bundle/app.js" data-prebuilt-js></script>
  </body>
</html>
